<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>웹프롬프트북 · MY XR UNIVERSE</title><link rel="stylesheet" href="course/style.css"></head><body><a class="skip" href="#main">본문 바로가기</a><header><nav><strong>MY XR UNIVERSE</strong><a href="course.html" >수업 홈</a><a href="workbook.html" >웹워크북</a><a href="promptbook.html" aria-current="page">프롬프트북</a><a href="templates.html" >디자인 3종</a></nav></header><main id="main"><span class="eyebrow">PROMPT LIBRARY · 12 PROMPTS</span><h1>AI와 함께 만드는 문장</h1><p class="lead">내 정보를 채우고, 필요한 프롬프트를 골라 복사하세요.</p><p class="callout">AI 답변은 초안입니다. 사실과 문법을 직접 확인합니다. 워크북에서 입력한 내용은 같은 브라우저에서 가져올 수 있습니다. 비밀번호·토큰·API 키는 입력하지 않습니다.</p><details><summary>내 정보 입력 / 수정</summary><div class="formgrid"><label class="field">닉네임<input id="nickname" data-save placeholder="NOVA" maxlength="250" autocomplete="off"></label><label class="field">GitHub 사용자명<input id="githubUsername" data-save placeholder="예: xr-nova (주소 전체 아님)" maxlength="250" autocomplete="off"></label><label class="field">좋아하는 것<input id="interest" data-save placeholder="게임 공간, 전시, 스포츠…" maxlength="250" autocomplete="off"></label><label class="field">한 줄 소개<input id="tagline" data-save placeholder="현실과 가상을 연결하는 XR 크리에이터" maxlength="250" autocomplete="off"></label><label class="field">관심 기술 3가지<input id="tech" data-save placeholder="Unity, Blender, WebXR" maxlength="250" autocomplete="off"></label><label class="field">프로젝트 제목<input id="projectTitle" data-save placeholder="나만의 가상 학교 전시관" maxlength="250" autocomplete="off"></label><label class="field">누구를 위한 것인가?<input id="audience" data-save placeholder="학교 작품을 보러 온 신입생" maxlength="250" autocomplete="off"></label><label class="field">어떤 불편이 있는가?<textarea id="problem" data-save placeholder="다른 학과의 작품을 볼 기회가 적다" maxlength="1500"></textarea></label><label class="field">어떤 경험을 만드는가?<textarea id="description" data-save placeholder="가상 전시관에서 작품을 선택하면 설명을 본다" maxlength="1500"></textarea></label><label class="field">첫 번째 작은 실험<textarea id="experiment" data-save placeholder="종이에 전시관 화면을 그리고 친구에게 동선을 물어본다" maxlength="1500"></textarea></label><label class="field">관심 분야<select id="focus" data-save><option>VR</option><option>AR</option><option>3D</option></select></label><label class="field">디자인<select id="design" data-save><option>Cosmos</option><option>Creative Studio</option><option>Next Level</option></select></label><label class="field">협업 번호<select id="studentNo" data-save><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option></select></label></div></details><div class="actions"><button id="loadWorkbook">워크북 정보 가져오기</button><button id="downloadPrompts">전체 프롬프트 TXT</button></div><div id="notice" role="status" aria-live="polite"></div><label class="field no-print">프롬프트 검색<input id="search" placeholder="예: 오류, README, P08"></label><div class="tabs no-print"><button data-filter="전체" aria-pressed="true">전체</button><button data-filter="1교시">1교시</button><button data-filter="2교시">2교시</button><button data-filter="3교시">3교시</button><button data-filter="심화">심화</button></div><p id="count" class="muted"></p><div id="prompts"></div></main><footer>AI × GitHub × XR · 50분 × 3교시 · 닉네임으로 만들고, 근거를 확인하고, 나의 변화 기록하기</footer><script>const DATA=[{"id": "P01", "session": "1교시", "title": "나의 관심 분야 탐색", "when": "관심 분야를 아직 못 골랐을 때", "text": "너는 고등학생의 XR 프로젝트 탐색을 돕는 멘토야.\n내가 좋아하는 것: {{interest}}\n경험 수준: 초보자. 관심 분야 후보: VR, AR, 3D.\n각 분야가 내 관심과 어떻게 연결되는지 쉬운 말로 설명해 줘.\n분야별 작은 프로젝트를 하나씩 제안해 줘. 3D 자체가 모두 XR인 것은 아니라는 점도 구분해 줘.\n각 제안은 대상, 불편, 핵심 경험, 처음 해 볼 작은 실험 순서로 작성해 줘.\n특정 도구의 최신 기능이나 무료 여부는 확인 전에는 단정하지 마.\n마지막에 내가 직접 선택할 질문 2개를 해 줘."}, {"id": "P02", "session": "1교시", "title": "README 자기소개", "when": "내 저장소의 첫 소개 작성", "text": "내 GitHub 저장소 my-xr-universe의 README 초안을 Markdown으로 작성해 줘.\n닉네임: {{nickname}}\n관심 분야: {{focus}}\n관심 기술: {{tech}}\n만들고 싶은 프로젝트: {{projectTitle}}\n설명: {{description}}\n현재 상태: 기획 중\n구성: 제목, 나의 관심, 프로젝트 아이디어, 첫 실험, 앞으로의 기록.\n아직 배우지 않은 기술을 능숙하게 사용한다고 쓰거나 프로젝트를 완성했다고 쓰지 마.\n실명, 학교·반·번호, 연락처는 넣지 마. 전체 15줄 이내로 써 줘."}, {"id": "P03", "session": "2교시", "title": "아이디어를 작은 실험으로", "when": "대상과 문제를 구체적으로 좁히기", "text": "너는 XR 프로젝트 코치야.\n프로젝트: {{projectTitle}}\n대상: {{audience}}\n불편: {{problem}}\n설명: {{description}}\n관심 분야: {{focus}}\n핵심 기능 1개만 선택해 초보자가 검증할 수 있는 첫 실험을 제안해 줘.\n표에 사용자 행동, 화면 반응, 필요한 자료, 성공 여부를 확인하는 방법을 써 줘.\n웹 포트폴리오 소개 페이지 제작과 실제 VR/AR 기능 개발을 구분해 줘.\n현재 수업에서는 소개 페이지까지 만들고 XR 기능 구현은 후속 과제로 남겨 줘."}, {"id": "P04", "session": "2교시", "title": "AI 답변 검토", "when": "그럴듯한 제안에서 확인할 점 찾기", "text": "다음 AI 답변을 검토해 줘.\n[아래에 검토할 답변을 붙여넣기]\n\n검토 기준:\n1. 사실과 추측을 구분했는가?\n2. 무료·호환·최신 기능 같은 주장을 출처로 확인했는가?\n3. 초보자의 시간과 준비물로 가능한가?\n4. 개인정보나 API 키가 필요한가?\n5. 성공 여부를 직접 확인할 수 있는가?\n답변마다 유지할 점, 고칠 점, 확인이 필요한 근거를 나눠 줘.\n출처를 찾을 수 없으면 확인 필요라고 써 줘. 존재하지 않는 URL은 만들지 마."}, {"id": "P05", "session": "2교시", "title": "협업 파일 초안", "when": "학생 번호 파일에 넣을 내용", "text": "공동 XR 아이디어 전시에 제안할 Markdown 초안을 작성해 줘.\n닉네임: {{nickname}}\n제목: {{projectTitle}}\n대상: {{audience}}\n불편: {{problem}}\nXR 경험: {{description}}\n첫 실험: {{experiment}}\n현재 상태: 기획 중\n제목 아래에 위 7개 항목을 목록으로 써 줘.\n실제 구현한 것처럼 과장하지 말고 내 설명에 없는 기술은 추가하지 마.\n이 내용은 collaboration/ideas/student-{{studentNo}}.md 파일 하나에만 넣을 거야."}, {"id": "P06", "session": "2교시", "title": "Pull Request 설명", "when": "변경 이유와 검토 요청 작성", "text": "다음 협업 변경의 Pull Request 제목과 본문을 작성해 줘.\n수정 파일: collaboration/ideas/student-{{studentNo}}.md\n아이디어: {{projectTitle}}\n변경 이유: 우리 반 XR 아이디어 전시에 제안을 추가함\n관련 이슈: chloeisLovely/my-xr-universe #1\n제목은 [아이디어 {{studentNo}}]로 시작해 줘.\n본문에 변경 내용, 이유, 친구에게 물어볼 질문 1개, 확인한 항목을 써 줘.\nRefs #1을 포함하고 Closes #1은 쓰지 마. 학급 전체 이슈를 자동 종료하지 않을 거야.\n테스트하지 않은 것을 테스트 완료라고 쓰지 마."}, {"id": "P07", "session": "2교시", "title": "친구에게 남길 피드백", "when": "구체적이고 존중하는 의견", "text": "다음 친구의 아이디어를 읽고 피드백 초안을 써 줘.\n[친구의 공개 아이디어를 붙여넣기]\n구성: 구체적으로 좋은 점 1개 + 사용자를 이해하기 위한 질문 1개 + 작은 개선 제안 1개.\n내가 직접 읽고 수정할 수 있게 4문장 이내로 써 줘.\n개인을 평가하지 말고 아이디어의 대상과 경험을 중심으로 이야기해 줘."}, {"id": "P08", "session": "3교시", "title": "MY_PROFILE 수정", "when": "세 디자인에서 공통으로 사용", "text": "아래 정보로 JavaScript의 const MY_PROFILE 객체만 작성해 줘.\n닉네임: {{nickname}}\n한 줄 소개: {{tagline}}\n관심 분야: {{focus}}\n관심 기술 3가지: {{tech}}\n프로젝트 제목: {{projectTitle}}\n프로젝트 설명: {{description}}\nGitHub 사용자명: {{githubUsername}}\n형식은 정확히 다음 키를 사용해 줘:\nconst MY_PROFILE = {\n  nickname: \"\", tagline: \"\", focus: \"VR\",\n  tech: [\"\", \"\", \"\"],\n  project: { title: \"\", description: \"\", status: \"기획 중\" },\n  githubUsername: \"\"\n};\nfocus는 VR, AR, 3D 중 하나로 써 줘. githubUsername에는 주소 전체나 @를 넣지 마.\n따옴표와 역슬래시는 JavaScript 문법에 맞게 처리해 줘.\nHTML 전체를 다시 만들지 말고 객체 코드만 반환해 줘."}, {"id": "P09", "session": "3교시", "title": "최소 범위 오류 수정", "when": "오류 메시지와 함께 질문", "text": "너는 초보자를 돕는 웹 개발 튜터야.\n내 작업: 단일 index.html의 MY_PROFILE 6개 항목 수정\n기대한 화면: [예: 닉네임이 NOVA로 표시]\n실제 현상: [예: 이름이 기본값 그대로]\n오류 메시지: [브라우저 Console에 나온 문구. 없으면 없음]\n수정한 코드: [MY_PROFILE 영역만 붙여넣기]\n가능성이 높은 원인부터 설명해 줘. 관찰하지 않은 오류를 단정하지 마.\n고쳐야 할 최소 구간과 고친 이유, 다시 확인할 순서를 알려 줘.\n비밀번호, 토큰, API 키는 요청하지 마. 디자인과 다른 기능은 바꾸지 마."}, {"id": "P10", "session": "3교시", "title": "배포 문제 확인", "when": "Pages 주소와 저장소 주소 구분", "text": "GitHub Pages의 정적 HTML 배포를 점검해 줘.\n저장소: https://github.com/{{githubUsername}}/my-xr-universe\n원하는 웹 주소: https://{{githubUsername}}.github.io/my-xr-universe/\n파일 위치: [예: main 브랜치 최상위 index.html]\nPages 설정: [예: Deploy from a branch / main / (root)]\nActions 상태: [대기, 진행 중, 성공, 실패 중 실제 확인한 상태]\n현상: [404, 이전 화면, 파일 목록 등]\n위 관찰 내용을 바탕으로 확인할 순서를 5단계 이내로 써 줘.\n배포 대기와 설정 오류를 구분해 줘. 공식 GitHub Docs를 기준으로 안내하고 확인하지 못한 부분은 확인 필요라고 써 줘."}, {"id": "P11", "session": "3교시", "title": "작품 소개 30초", "when": "내가 바꾼 점과 다음 실험", "text": "내 포트폴리오를 30초 동안 소개하는 발표 초안을 써 줘.\n닉네임: {{nickname}}\n선택한 디자인: {{design}}\n프로젝트: {{projectTitle}}\n대상: {{audience}}\n첫 실험: {{experiment}}\n내가 실제로 바꾼 점: [직접 입력]\n구성: 누구를 위한 아이디어인지, 오늘 바꾼 부분, 다음에 해 볼 일.\nXR 기능을 구현했다는 표현은 쓰지 마. 오늘 완성한 것은 소개 웹페이지야.\n내 말투로 수정하기 쉬운 4문장 이내로 써 줘."}, {"id": "P12", "session": "심화", "title": "작은 디자인 개선", "when": "기본 완성 후 한 가지만 바꾸기", "text": "현재 완성한 단일 HTML 포트폴리오를 개선하고 싶어.\n선택한 디자인: {{design}}\n개선하려는 한 가지: [색상 대비 / 글자 크기 / 버튼 문구 중 선택]\n현재 관련 코드: [해당 CSS 또는 HTML만 붙여넣기]\nMY_PROFILE 구조, 링크, 프로젝트 모달, 모바일 레이아웃을 유지해 줘.\n수정 전과 후의 코드, 변경 이유, PC·모바일에서 확인할 항목을 알려 줘.\n새 라이브러리, 유료 서비스, API 연결은 추가하지 마.\n한 번에 한 가지만 바꾸고 확인할 수 있게 해 줘."}];const fields=[...document.querySelectorAll('[data-save]')];let filter='전체';
const notice=document.getElementById('notice');const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filled(t){return t.replace(/\{\{(\w+)\}\}/g,(_,k)=>document.getElementById(k)?.value.trim()||'[직접 입력: '+k+']');}
function render(){const q=document.getElementById('search').value.toLowerCase();const list=DATA.filter(p=>(filter==='전체'||p.session===filter)&&[p.id,p.title,p.when,p.text].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=list.length+'개 프롬프트';document.getElementById('prompts').innerHTML=list.map(p=>`<article class="card prompt" id="${p.id}"><span class="eyebrow">${p.id} · ${p.session}</span><h2>${esc(p.title)}</h2><p class="muted">${esc(p.when)}</p><pre tabindex="0">${esc(filled(p.text))}</pre><button data-copy="${p.id}" class="primary">${p.id} 복사</button></article>`).join('')||'<p>검색 결과가 없습니다. 검색어를 바꿔보세요.</p>';}
function load(){try{const d=JSON.parse(localStorage.getItem('xr-course-workbook-v1')||'{}');fields.forEach(f=>{if(typeof d[f.id]==='string')f.value=d[f.id];});notice.textContent=Object.keys(d).length?'워크북 정보를 가져왔습니다.':'저장된 워크북 정보가 없습니다. 위에서 직접 입력할 수 있습니다.';}catch(e){notice.textContent='워크북 정보를 가져올 수 없습니다. 직접 입력해 주세요.';}render();}
fields.forEach(f=>f.addEventListener('input',render));document.getElementById('search').oninput=render;document.getElementById('loadWorkbook').onclick=load;
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();});
document.getElementById('prompts').onclick=async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const text=filled(DATA.find(p=>p.id===b.dataset.copy).text);try{await navigator.clipboard.writeText(text);b.textContent='복사 완료';notice.textContent=b.dataset.copy+' 복사 완료. AI 대화창에 붙여넣으세요.';}catch(err){const pre=b.previousElementSibling;const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);notice.textContent='자동 복사가 제한되어 텍스트를 선택했습니다. Ctrl+C 또는 길게 눌러 복사하세요.';}};
document.getElementById('downloadPrompts').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([DATA.map(p=>p.id+' '+p.title+'\n'+filled(p.text)).join('\n\n================\n\n')],{type:'text/plain;charset=utf-8'}));a.download='MY_XR_PROMPTS.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};load();</script></body></html>
